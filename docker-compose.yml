services:
  aave-monitor:
    build: .
    container_name: aave-monitor
    restart: unless-stopped

    # Use the Raspberry Pi's network namespace.
    # This allows the container to access the native Ollama
    # service at 127.0.0.1:11434.
    network_mode: host

    volumes:
      - ./data:/app/data
      - ./secret.key:/app/secret.key:ro
      - ./secrets.enc.json:/app/secrets.enc.json
      - ./constants.py:/app/constants.py:ro

    environment:
      OLLAMA_URL: http://127.0.0.1:11434/api/generate

    deploy:
      resources:
        limits:
          memory: 512M
